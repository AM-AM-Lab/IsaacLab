params:
  # 随机种子（保证可复现）
  seed: 42

  # environment wrapper clipping
  # 环境侧动作裁剪上限（通常策略输出在 [-1, 1]）
  env:
    clip_actions: 1.0
  algo:
    # 连续动作空间 A2C/PPO 基础算法
    name: a2c_continuous

  model:
    # 连续动作策略：输出均值 + 对数方差
    name: continuous_a2c_logstd

  network:
    name: actor_critic
    # 是否 actor/critic 分离网络（False 表示共享主体）
    separate: False
    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: 0
        # 固定方差（不随状态变化）
        fixed_sigma: True
    mlp:
      # MLP 主干层宽
      units: [256,128,64]
      d2rl: False
      activation: elu
      initializer:
        name: default
        scale: 2
    rnn:
      # 时序建模：GRU
        name: gru
        units: 64
        layers: 1
        # before_mlp: False
        # layer_norm: True
  config:
    env_name: rlgpu
    # 训练设备（可在启动命令中覆盖）
    device: 'cuda:0'
    device_name: 'cuda:0'
    env_config:
      # 这里是 rl_games 侧默认值；通常会被命令行 --num_envs 覆盖
      num_envs: 8192

    name: arl_robot_1_track_position_state_based
    reward_shaper:
      # min_val: -1
      # 奖励整体缩放系数
      scale_value: 0.1

    # PPO 核心超参数
    normalize_advantage: True
    gamma: 0.98
    tau: 0.95
    ppo: True
    learning_rate: 1e-4
    lr_schedule: adaptive
    kl_threshold: 0.016
    save_best_after: 10
    score_to_win: 100000
    grad_norm: 1.0
    entropy_coef: 0
    truncate_grads: True
    e_clip: 0.2
    clip_value: False
    # rollout 采样规模与优化批次
    num_actors: 1024
    horizon_length: 32
    minibatch_size: 2048
    mini_epochs: 4
    critic_coef: 2
    normalize_input: True
    bounds_loss_coef: 0.0001
    max_epochs: 1500
    normalize_value: True
    use_diagnostics: True
    value_bootstrap: True
    #weight_decay: 0.0001
    use_smooth_clamp: False

    player:
      # 推理/回放配置
      render: True
      deterministic: True
      games_num: 100000
